name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Gitleaks (SAST)
        uses: gitleaks/gitleaks-action@v2
        if: matrix.os == 'ubuntu-latest'

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -cover ./...

  build:
    name: Build Binaries with Version
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Get version from tag
        id: tag_name
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build for Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.tag_name.outputs.VERSION }}" -o dist/assinatura-${{ steps.tag_name.outputs.VERSION }}-linux-amd64 ./cmd/assinatura

      - name: Build for Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.tag_name.outputs.VERSION }}" -o dist/assinatura-${{ steps.tag_name.outputs.VERSION }}-windows-amd64.exe ./cmd/assinatura

      - name: Build for macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${{ steps.tag_name.outputs.VERSION }}" -o dist/assinatura-${{ steps.tag_name.outputs.VERSION }}-darwin-amd64 ./cmd/assinatura

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  deploy-staging:
    name: Deploy to Staging
    needs: publish
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/
          
      - name: Deploy Técnico em Staging
        run: |
          echo "Implantando binários da release no ambiente de Staging..."
          # Substituir pelos comandos reais de deploy (ex: scp, rsync, aws s3 sync)
          
      - name: Validação Dinâmica / Health Check
        run: |
          echo "Validando endpoints e executando testes E2E em Staging"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/
          
      - name: Deploy em Produção
        run: |
          echo "Implantando binários da release em Produção..."
          # Substituir pelos comandos reais de deploy
